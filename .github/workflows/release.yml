name: Release build

# Builds the Windows installer on GitHub's own runners whenever a v* tag is pushed,
# and attaches the .exe + SHA-256 checksum to the release for that tag. The build is
# fully reproducible from the public source — skeptical users can verify the checksum
# against their own build. Manual dispatch (workflow_dispatch) runs the build without
# publishing anything, for testing the pipeline.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build the installer
        # --publish never: electron-builder otherwise tries to auto-publish a release on CI
        # (demanding GH_TOKEN) — attachment here is the softprops step's job, not the builder's.
        run: npm run dist -- --publish never

      - name: Compute SHA-256 checksum
        shell: powershell
        run: |
          $exe = Get-ChildItem "dist\Constellation Setup *.exe" | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "dist\Constellation-Setup-sha256.txt"
          Get-Content "dist\Constellation-Setup-sha256.txt"

      - name: Upload build artifacts (backup copy — always)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.run_id }}
          path: |
            dist/Constellation Setup *.exe
            dist/Constellation-Setup-sha256.txt

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Constellation Setup *.exe
            dist/Constellation-Setup-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
