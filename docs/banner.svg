<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Constellation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04050c"/>
      <stop offset="0.6" stop-color="#070a16"/>
      <stop offset="1" stop-color="#0b0f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fb8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9fb8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <!-- scattered stars -->
  <g fill="#dfe8ff">
    <circle cx="60" cy="52" r="1.4" opacity="0.8"/><circle cx="150" cy="220" r="1.1" opacity="0.5"/>
    <circle cx="240" cy="90" r="1.6" opacity="0.9"/><circle cx="330" cy="250" r="1.0" opacity="0.4"/>
    <circle cx="420" cy="40" r="1.2" opacity="0.6"/><circle cx="510" cy="160" r="1.5" opacity="0.7"/>
    <circle cx="610" cy="70" r="1.1" opacity="0.5"/><circle cx="700" cy="240" r="1.4" opacity="0.8"/>
    <circle cx="790" cy="120" r="1.2" opacity="0.6"/><circle cx="880" cy="36" r="1.5" opacity="0.9"/>
    <circle cx="960" cy="200" r="1.1" opacity="0.5"/><circle cx="1050" cy="84" r="1.6" opacity="0.8"/>
    <circle cx="1130" cy="246" r="1.2" opacity="0.6"/><circle cx="90" cy="150" r="1.0" opacity="0.4"/>
    <circle cx="200" cy="30" r="1.0" opacity="0.4"/><circle cx="390" cy="180" r="1.0" opacity="0.4"/>
    <circle cx="560" cy="252" r="1.0" opacity="0.4"/><circle cx="660" cy="140" r="1.0" opacity="0.4"/>
    <circle cx="840" cy="264" r="1.0" opacity="0.4"/><circle cx="1010" cy="30" r="1.0" opacity="0.4"/>
    <circle cx="1170" cy="130" r="1.0" opacity="0.4"/><circle cx="300" cy="140" r="1.0" opacity="0.4"/>
  </g>
  <!-- the constellation: brighter stars joined by faint lines -->
  <g stroke="#9fb8ff" stroke-opacity="0.35" stroke-width="1" fill="none">
    <polyline points="355,205 430,150 520,185 600,110 690,150 760,90"/>
  </g>
  <g fill="#cdd9ff">
    <circle cx="355" cy="205" r="2.6" opacity="0.95"/>
    <circle cx="430" cy="150" r="3.2" opacity="0.95"/>
    <circle cx="520" cy="185" r="2.4" opacity="0.9"/>
    <circle cx="600" cy="110" r="3.6" opacity="1"/>
    <circle cx="690" cy="150" r="2.4" opacity="0.9"/>
    <circle cx="760" cy="90" r="2.8" opacity="0.95"/>
  </g>
  <circle cx="600" cy="110" r="26" fill="url(#glow)"/>
  <circle cx="600" cy="110" r="60" fill="url(#glow)" opacity="0.5"/>
  <!-- wordmark -->
  <text x="600" y="205" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="600" letter-spacing="14" fill="#eef2ff">CONSTELLATION</text>
  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing="2" fill="#9fb8ff" opacity="0.85">✦ · Your stories, written among the stars · ✦</text>
</svg>
